name: Refresh station list

# Every Monday the list of working Serbian stations is checked again.
# The app downloads stations.json from here, so dead stations disappear without reinstalling.
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check stations
        run: python3 scripts/check_stations.py
      - name: Save the list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stations.json
          git diff --cached --quiet || git commit -m "Osvežena lista srpskih stanica"
          git push
