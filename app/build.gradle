plugins {
    id 'com.android.application'
}

android {
    namespace 'rs.nocnisat'
    compileSdk 34

    defaultConfig {
        applicationId 'rs.nocnisat'
        minSdk 21
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }

    signingConfigs {
        shared {
            storeFile file('nocnisat.keystore')
            storePassword 'nocnisat'
            keyAlias 'nocnisat'
            keyPassword 'nocnisat'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
